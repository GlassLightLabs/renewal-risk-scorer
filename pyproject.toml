[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "renewal-risk-scorer"
version = "0.1.0"
description = "Rank renewal risk across a SaaS book of business: a transparent health scorecard, a calibrated ML model with reason codes, a GRR forecast, and save plays."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Peter Inglehart" }]
keywords = ["customer success", "renewals", "churn", "health score", "revops", "gainsight", "salesforce"]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
claude = ["anthropic>=0.80"]
app = ["streamlit>=1.50", "anthropic>=0.80"]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8", "pandas-stubs", "types-PyYAML"]

[project.scripts]
renewal-risk = "renewal_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"renewal_risk" = ["profiles/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:lightgbm"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

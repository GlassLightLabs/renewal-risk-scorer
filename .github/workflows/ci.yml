name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy src
      - name: Tests (includes a Streamlit app smoke test)
        run: pytest -q
      - name: End-to-end demo for every profile
        run: |
          for p in ai_usage saas consumption hardware services; do
            renewal-risk demo --profile "$p" --as-of 2026-12-01 --out "demo_out/$p" --top 5
          done
      - name: Upload demo reports
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v5
        with:
          name: demo-reports
          path: demo_out/*/report.md
